staleness_days: {commit: 7, propose: 14, develop: 21, qualify: 30, prospect: 45}
aging_norm_days: {prospect: 30, qualify: 30, develop: 45, propose: 30, commit: 21}
big_deal_threshold: 100000
close_date_horizon_days: 270
fiscal_year_start_month: 7        # July fiscal-year start; configurable per org
expected_currency: USD
coverage_ratio_min: 3.0
quotas: {}                        # owner -> quarterly quota; seed fills this
rule_weights: {H1: 15, H2: 20, H3: 10, H4: 20, H5: 25, H6: 10, H7: 10, H8: 5, H9: 5, H10: 10, H11: 20}
push_alarm_days: 21               # H11: single close-date push >= this (Gong: >=3-week pushes signal lost control)
cumulative_push_alarm_days: 45    # H11: total later-drift across pushes >= this
disqualify_review_pushes: 3       # brief marker: "review close plan" at this push_count
min_closed_for_win_rate: 10       # trailing-win-rate coverage basis needs at least this many stored closed outcomes
patterns:                         # forecast-integrity detection — coaching signal, never a comp input
  overcall_share_min: 0.5         # flag overcall when >= this share of ever-commit opps later pushed or lost
  undercall_won_share_min: 0.75   # flag undercall when >= this share of observed wins never showed commit/best_case
  undercall_omitted_share_min: 0.4   # ...or omitted dollars >= this share of open pipeline AND
  undercall_farout_share_min: 0.1    #    far-out (beyond horizon) dollars >= this share (conjunction)
healthy_score_threshold: 80
min_opps_for_owner_score: 5       # below this, owner score carries a small-n flag
next_step_quality:
  min_chars: 15
  filler_phrases: ["follow up", "touch base", "check in", "circle back", "tbd", "pending"]
  action_verbs: ["send", "schedule", "present", "review", "confirm", "deliver", "meet", "call", "demo", "negotiate", "sign", "propose"]
stage_map:
  default: {prospect: prospect, qualify: qualify, develop: develop, propose: propose, commit: commit, closed_won: closed_won, closed_lost: closed_lost}
  # example alternate vocabulary a Dynamics/MSX export might carry:
  dynamics_default: {Qualify: qualify, Develop: develop, Propose: propose, Close: commit, Won: closed_won, Lost: closed_lost}
  # HubSpot default deal-pipeline stages (edit if your pipeline is customized):
  hubspot: {Appointment Scheduled: prospect, Qualified To Buy: qualify, Presentation Scheduled: develop, Decision Maker Bought-In: propose, Contract Sent: commit, Closed Won: closed_won, Closed Lost: closed_lost}

# Optional keys — schema-checked when present, safe to omit (defaults in parens):
# display_currency_symbol: "€"                              # money symbol everywhere ($)
# pipeline_gen_weekly_target: 500000                        # Flow pacing target line (none — no line guessed)
# trend_snapshots: 8                                        # points in the headline desk-score trend (8)
# delta_detail_max_per_rule: 20                             # collapse a rule's since-last-run detail past this many opps (20)
# low_coverage_desk_note_share: 0.75                        # desk-wide under-coverage note when >= this share of quota'd owners is under 1.00x (0.75)
# staleness_escalation: {escalate_days: 7, review_days: 21} # H1 tiers flag/escalate/review, days BEYOND the per-stage threshold; escalate_days < review_days (off)
# aging_norm_mode: derived                                 # H6 norms: static aging_norm_days (default) or derived from observed per-stage dwell
# aging_norm_derived_multiple: 1.75                        # derived mode: norm = round(this x median observed dwell), per stage (1.75)

# Monday Packet draft templates (R2.6). Optional block — safe to omit; the
# rule-to-draft generators (src/drafts.py) only run when PIPELINE_HYGIENE_PACKETS
# is on. All template text lives here so it is editable without code, no LLM.
drafts:
  proposed_date_offset_business_days: 10   # R2.1/R2.2 fallback: as_of + this many business days
  stage_exit:                              # R2.1 next-step criterion per open stage
    prospect: "the buyer has confirmed a business problem worth solving"
    qualify: "budget, authority, need, and timeline are confirmed"
    develop: "the economic buyer has agreed the evaluation criteria"
    propose: "pricing and terms are with the buyer for review"
    commit: "the buyer has verbally agreed and paperwork is in motion"
  next_step_template: "Confirm {criterion} by {due_date}"
  timeline_email:                          # R2.2 timeline-validation email
    subject: "Confirming the timeline for {account}"
    body: |
      Hi {account} team,

      As we plan the next few weeks on {opp_name}, I want to make sure the
      timeline still reflects reality. Our records show a target close of
      {close_date}; based on how this deal has moved, {proposed_close_date}
      looks like a more realistic date.

      Could you confirm the date your team is working toward so we can plan
      accordingly?

      Thanks,
      {owner}
  disqualification:                        # R2.3 disqualification-review clinic doc
    questions:
      - "What has changed in the buyer's business case since this deal was first committed?"
      - "What single next event would prove this deal is still real, and when does it happen?"
  coverage_task_template: "Pipeline generation for {owner}: coverage is below target. Work these plays this week:"
  coverage_plays:                          # R2.5 pipeline-generation play names
    - "Re-engage closed-lost accounts from the last two quarters"
    - "Book three first meetings from existing customer relationships"
    - "Run a partner-sourced pipeline session"
  packet:                                  # R4 Monday Packet assembly/export
    # Minutes-to-clear (R4.5): per-item-type minute constants. The packet PRINTS
    # the computed sum (item_count x these), never a fixed "15-minute" slogan a
    # large packet would falsify.
    minutes_per_item:
      field_update: 1
      next_step: 2
      email_draft: 4
      clinic_doc: 6
      agenda_item: 3
    default_minutes_per_item: 2
